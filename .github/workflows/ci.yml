name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet tool run csharpier check .

      - name: Run tests
        run: dotnet test
